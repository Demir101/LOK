[project]
name = "lok-context-integrity-benchmark"
version = "1.0.0"
description = "LOK — LOOK FOR IT. AI Correction & Context Integrity Benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["lok*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "E501",    # line length is enforced by `ruff format`; long user-facing string literals are allowed
    "RUF001",  # ambiguous unicode characters are intentional (typographic normalisation tables)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Only constant SQL fragments (table names, WHERE clauses) are interpolated; all values are parameterized.
"lok/storage/*.py" = ["S608"]
