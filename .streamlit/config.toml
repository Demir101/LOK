# LOK Streamlit configuration. Usage statistics are disabled so that no data leaves the machine.
[browser]
gatherUsageStats = false

[server]
# Bind to this machine only; LOK is a local, single-user tool.
address = "localhost"
headless = true
runOnSave = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"
